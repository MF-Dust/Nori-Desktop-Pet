name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已有标签时可直接填写，例如 v0.1.0；留空则自动创建"
        required: false
        type: string
      bump:
        description: "没有填写标签时的版本递增级别"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      include_runtime:
        description: "是否打包 .NET Runtime"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  validate:
    name: 校验并创建版本标签
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      mode: ${{ steps.version.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - id: version
        name: 校验或自动创建 v* 标签
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          BUMP: ${{ inputs.bump }}
        run: |
          git fetch --tags --force
          tag="$TAG"
          if [ -n "$tag" ]; then
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "标签必须匹配 v<major>.<minor>.<patch>: $tag" >&2
              exit 1
            fi
            git show-ref --tags --verify --quiet "refs/tags/$tag" || {
              echo "标签不存在: $tag" >&2
              exit 1
            }
            echo "使用已有标签: $tag"
          else
            latest="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
            if [ -z "$latest" ]; then
              initial_version="$(sed -nE 's/.*<Version[^>]*>([0-9]+\.[0-9]+\.[0-9]+)<\/Version>.*/\1/p' app/desktop/Nori.Desktop/Nori.Desktop.csproj | head -n1)"
              initial_version="${initial_version:-0.1.0}"
              tag="v$initial_version"
              echo "没有历史版本标签, 使用项目初始版本: $tag"
            else
              if [[ ! "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                echo "无法解析最新标签: $latest" >&2
                exit 1
              fi
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="${BASH_REMATCH[3]}"
              case "$BUMP" in
                major) major=$((major + 1)); minor=0; patch=0 ;;
                minor) minor=$((minor + 1)); patch=0 ;;
                patch) patch=$((patch + 1)) ;;
                *) echo "不支持的递增级别: $BUMP" >&2; exit 1 ;;
              esac
              tag="v$major.$minor.$patch"
            fi
            if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
              echo "目标标签已存在: $tag" >&2
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "chore: release $tag"
            git push origin "$tag"
            echo "已创建并推送标签: $tag"
          fi
          version="${tag#v}"
          if [ "${{ inputs.include_runtime }}" = "true" ]; then mode=self-contained; else mode=framework-dependent; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=nori@$version" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "版本: $version"
          echo "Sentry release: nori@$version"
          echo "发布模式: $mode"

  frontend:
    name: Web 构建与 source map
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/desktop
    env:
      VITE_SENTRY_DSN_WEB: ${{ secrets.SENTRY_DSN_WEB }}
      NORI_SENTRY_RELEASE: ${{ needs.validate.outputs.release }}
      NORI_SENTRY_ENVIRONMENT: production
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT_WEB: ${{ secrets.SENTRY_PROJECT_WEB }}
      SENTRY_URL: ${{ secrets.SENTRY_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: 检查 Sentry Secrets
        shell: bash
        run: |
          for name in VITE_SENTRY_DSN_WEB SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT_WEB; do
            if [ -z "${!name}" ]; then echo "缺少 GitHub Secret: $name" >&2; exit 1; fi
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/desktop/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: 确认 source map 已由 Sentry 插件处理
        shell: bash
        run: |
          if find dist -name '*.map' -print -quit | grep -q .; then
            echo "source map 未删除, 可能没有完成 Sentry 上传" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nori-dist-${{ needs.validate.outputs.version }}
          path: app/desktop/dist
          if-no-files-found: error
          retention-days: 14

  native_release:
    name: 创建 Native Sentry release
    needs: validate
    runs-on: ubuntu-latest
    env:
      NORI_SENTRY_RELEASE: ${{ needs.validate.outputs.release }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT_NATIVE: ${{ secrets.SENTRY_PROJECT_NATIVE }}
      SENTRY_URL: ${{ secrets.SENTRY_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 创建 Native release
        shell: bash
        run: |
          for name in SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT_NATIVE; do
            if [ -z "${!name}" ]; then echo "缺少 GitHub Secret: $name" >&2; exit 1; fi
          done
          dotnet restore app/desktop/Nori.Desktop/Nori.Desktop.csproj
          cli="$HOME/.nuget/packages/sentry/6.9.0/tools/sentry-cli-Linux-x86_64"
          test -f "$cli"
          chmod +x "$cli"
          if ! "$cli" releases new --org "$SENTRY_ORG" --project "$SENTRY_PROJECT_NATIVE" "$NORI_SENTRY_RELEASE"; then
            "$cli" releases info --org "$SENTRY_ORG" --project "$SENTRY_PROJECT_NATIVE" "$NORI_SENTRY_RELEASE" >/dev/null
          fi

  native:
    name: ${{ matrix.name }} · ${{ needs.validate.outputs.mode }}
    needs: [validate, frontend, native_release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            rid: win-x64
          - os: ubuntu-latest
            name: linux
            rid: linux-x64
          - os: macos-14
            name: macos
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app/desktop
    env:
      NORI_VERSION: ${{ needs.validate.outputs.version }}
      NORI_INCLUDE_RUNTIME: ${{ inputs.include_runtime }}
      NORI_SENTRY_DSN_NATIVE: ${{ secrets.SENTRY_DSN_NATIVE }}
      NORI_SENTRY_RELEASE: ${{ needs.validate.outputs.release }}
      NORI_SENTRY_ENVIRONMENT: production
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT_NATIVE: ${{ secrets.SENTRY_PROJECT_NATIVE }}
      SENTRY_URL: ${{ secrets.SENTRY_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: nori-dist-${{ needs.validate.outputs.version }}
          path: app/desktop/dist

      - name: 检查 Sentry Native Secrets
        shell: bash
        if: matrix.name != 'windows'
        run: |
          for name in NORI_SENTRY_DSN_NATIVE SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT_NATIVE; do
            if [ -z "${!name}" ]; then echo "缺少 GitHub Secret: $name" >&2; exit 1; fi
          done

      - name: 检查 Sentry Native Secrets (Windows)
        shell: pwsh
        if: matrix.name == 'windows'
        run: |
          $names = @('NORI_SENTRY_DSN_NATIVE', 'SENTRY_AUTH_TOKEN', 'SENTRY_ORG', 'SENTRY_PROJECT_NATIVE')
          foreach ($name in $names) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) { throw "缺少 GitHub Secret: $name" }
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 发布 Windows
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $env:NORI_SKIP_FRONTEND = '1'
          $env:NORI_KEEP_SYMBOLS = '1'
          $selfContained = if ('${{ inputs.include_runtime }}' -eq 'true') { 'true' } else { 'false' }
          dotnet publish Nori.Desktop/Nori.Desktop.csproj -c Release -r $env:RID --self-contained $selfContained `
            -p:Version=$env:NORI_VERSION `
            -p:NoriSentryDsnNative=$env:NORI_SENTRY_DSN_NATIVE `
            -p:NoriSentryRelease=$env:NORI_SENTRY_RELEASE `
            -p:NoriSentryEnvironment=$env:NORI_SENTRY_ENVIRONMENT `
            -p:DebugType=portable -p:DebugSymbols=true `
            -p:PublishSingleFile=false -p:PublishReadyToRun=false `
            -o bin/publish/$env:RID
        env:
          RID: ${{ matrix.rid }}

      - name: 上传 Windows .NET 符号
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $cli = Get-ChildItem "$env:USERPROFILE\.nuget\packages\sentry\6.9.0\tools\sentry-cli-Windows-*.exe" | Select-Object -First 1
          if ($null -eq $cli) { throw '找不到 Sentry CLI' }
          & $cli.FullName debug-files upload --org $env:SENTRY_ORG --project $env:SENTRY_PROJECT_NATIVE --type portablepdb bin/publish/$env:RID
        env:
          RID: ${{ matrix.rid }}

      - name: 删除 Windows 符号
        if: matrix.name == 'windows'
        shell: pwsh
        run: Get-ChildItem -Path bin/publish/${{ matrix.rid }} -Recurse -Filter *.pdb | Remove-Item -Force

      - name: 发布 Linux / macOS
        if: matrix.name != 'windows'
        shell: bash
        run: |
          chmod +x publish.sh
          NORI_SKIP_FRONTEND=1 NORI_KEEP_SYMBOLS=1 ./publish.sh "${{ matrix.rid }}"

      - name: 上传 Linux / macOS .NET 符号
        if: matrix.name != 'windows'
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "linux" ]; then cli="$HOME/.nuget/packages/sentry/6.9.0/tools/sentry-cli-Linux-x86_64"; else cli="$HOME/.nuget/packages/sentry/6.9.0/tools/sentry-cli-Darwin-arm64"; fi
          test -f "$cli"
          chmod +x "$cli"
          "$cli" debug-files upload --org "$SENTRY_ORG" --project "$SENTRY_PROJECT_NATIVE" --type portablepdb "bin/publish/${{ matrix.rid }}"

      - name: 剥离 Linux / macOS 符号并重打包
        if: matrix.name != 'windows'
        shell: bash
        run: |
          find "bin/publish/${{ matrix.rid }}" -name '*.pdb' -delete
          if [[ "${{ matrix.name }}" == "linux" ]]; then
            rm -f "bin/publish/${{ matrix.rid }}/nori-${NORI_VERSION}-${{ matrix.rid }}.tar.gz"
            tar -czf "bin/publish/${{ matrix.rid }}/nori-${NORI_VERSION}-${{ matrix.rid }}.tar.gz" -C "bin/publish/${{ matrix.rid }}/app" .
          fi

      - uses: actions/upload-artifact@v4
        if: matrix.name == 'windows'
        with:
          name: nori-${{ needs.validate.outputs.version }}-${{ matrix.rid }}-${{ needs.validate.outputs.mode }}
          path: app/desktop/bin/publish/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: matrix.name == 'linux'
        with:
          name: nori-${{ needs.validate.outputs.version }}-${{ matrix.rid }}-${{ needs.validate.outputs.mode }}
          path: app/desktop/bin/publish/${{ matrix.rid }}/nori-*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: matrix.name == 'macos'
        with:
          name: nori-${{ needs.validate.outputs.version }}-${{ matrix.rid }}-${{ needs.validate.outputs.mode }}
          path: app/desktop/bin/publish/${{ matrix.rid }}/Nori.app
          if-no-files-found: error
          retention-days: 14

  native_finalize:
    name: 完成 Native Sentry release
    needs: [native, validate]
    runs-on: ubuntu-latest
    env:
      NORI_SENTRY_RELEASE: ${{ needs.validate.outputs.release }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT_NATIVE: ${{ secrets.SENTRY_PROJECT_NATIVE }}
      SENTRY_URL: ${{ secrets.SENTRY_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Finalize Native release
        shell: bash
        run: |
          dotnet restore app/desktop/Nori.Desktop/Nori.Desktop.csproj
          cli="$HOME/.nuget/packages/sentry/6.9.0/tools/sentry-cli-Linux-x86_64"
          chmod +x "$cli"
          "$cli" releases finalize --org "$SENTRY_ORG" --project "$SENTRY_PROJECT_NATIVE" "$NORI_SENTRY_RELEASE"
