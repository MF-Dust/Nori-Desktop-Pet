name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 四道门: pnpm build / pnpm test / dotnet build / dotnet test, 三平台各跑一遍
jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            rid: win-x64
          - os: ubuntu-latest
            name: linux
            rid: linux-x64
          - os: macos-14
            name: macos
            rid: osx-arm64

    defaults:
      run:
        working-directory: app/desktop

    steps:
      - uses: actions/checkout@v4

      # WebKitGTK: Linux 上 NativeWebView 的原生依赖 (无它 dotnet build 仍能过, 运行期才需要)
      - name: 安装 Linux 原生依赖
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libgtk-3-0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/desktop/pnpm-lock.yaml

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: pnpm install --frozen-lockfile

      - name: 前端门 · 类型检查与构建
        run: pnpm build

      - name: 前端门 · 单元测试
        run: pnpm test

      - name: 后端门 · 构建
        run: dotnet build --configuration Release

      - name: 后端门 · 单元测试
        run: dotnet test --configuration Release --no-build

      # 发布冒烟: 只验证 publish 能产出可执行文件, 不做运行
      - name: 发布冒烟 (Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          dotnet publish Nori.Desktop/Nori.Desktop.csproj -c Release -r ${{ matrix.rid }} \
            --self-contained false -o bin/ci-publish
          test -f bin/ci-publish/Nori.Desktop.exe

      - name: 发布冒烟 (Linux / macOS)
        if: matrix.name != 'windows'
        run: |
          chmod +x publish.sh
          ./publish.sh ${{ matrix.rid }}
          test -f "bin/publish/${{ matrix.rid }}/app/Nori.Desktop"
