[package]
name = "nori-desktop-pet"
version = "0.1.0"
description = "Nori Desktop Pet - a desktop pet application"
authors = ["erhio", "Nori", "qicajie"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nori_desktop_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
sys-locale = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = "0.4"
reqwest = { version = "0.12", features = ["json", "blocking"] }
# 压缩算法精简, 仅启用 deflate(纯 Rust miniz_oxide 后端), 避免编译依赖 cmake 的 zlib-ng/zstd 等 C 依赖
zip = { version = "1", default-features = false, features = ["deflate"] }
# 全局鼠标位置 (桌宠头部跟踪, 光标在窗口外时仍可跟踪)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

